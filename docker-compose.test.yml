# Local test database so the full suite runs (not silently skipped).
#
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/bibliome_test pytest
#   docker compose -f docker-compose.test.yml down
#
# conftest.py connects here to create/drop a throwaway `bibliome_test` database.
services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral — this is a throwaway test DB
