name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # conftest connects here to create/drop the throwaway test database.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bibliome_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      # The two DNA engine guards. Neither touches the database.
      #
      # The probe fails if any archetype's win share leaves the accepted band on
      # the correlated shelf model — its own docstring asked to be wired in here
      # "so the next re-anchor can't regress silently", and for a while it wasn't.
      # The audit fails on broken invariants: a vocabulary table missing a slug, an
      # un-normalised baseline, two archetypes sharing a primary pair, a type that
      # cannot win on its own anchors, a gate that refuses an ordinary reader.
      #
      # Deliberately NOT --strict. The audit's warnings are deviations that want a
      # human decision, not build breakage; run it locally and read the numbers.
      - name: DNA archetype distribution probe
        run: python -m scripts.dna_bias_probe

      - name: DNA engine audit
        run: python -m scripts.dna_audit
