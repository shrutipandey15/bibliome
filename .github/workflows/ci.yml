name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # conftest connects here to create/drop the throwaway test database.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bibliome_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: ruff (report only)
        continue-on-error: true
        run: ruff check .

      - name: bandit (report only)
        continue-on-error: true
        run: bandit -r app

      - name: pip-audit (report only)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Checkout frontend for contract check
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: shrutipandey15/bibliome-frontend
          path: bibliome-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}

      - name: DNA contract check (backend ↔ frontend)
        run: python dna_contract_check.py bibliome-frontend
