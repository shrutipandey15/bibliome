# Book DNA — nginx reverse proxy configuration
# Backend: uvicorn on 127.0.0.1:8100
# Frontend: static Vite build in /srv/bookdna/frontend/
#
# Install:
#   sudo cp deploy/bookdna.nginx.conf /etc/nginx/sites-available/bookdna
#   sudo ln -s /etc/nginx/sites-available/bookdna /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bookdna.fdev31.space
#
# NOTE: the limit_req_zone below must live in the http{} context. If nginx errors
# with "limit_req_zone directive is not allowed here", move that one line into
# /etc/nginx/nginx.conf (http block) and keep the limit_req in the location.

limit_req_zone $binary_remote_addr zone=bookdna_api:10m rate=20r/s;

server {
    server_name bookdna.fdev31.space;

    # ── Security headers (audit P1-8) ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # SPA needs inline styles; tighten per your build if you drop inline usage.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Cap request bodies (CSV import is the largest legitimate payload).
    client_max_body_size 6m;

    # ── Frontend: static SPA ──
    location / {
        root /srv/bookdna/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively (Vite hashes filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Backend API ──
    location /api/ {
        # nginx-level rate limit (defense in depth; app also rate-limits).
        limit_req zone=bookdna_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # DNA generation can take a few seconds
        proxy_read_timeout 30s;
    }

    # ── Health check ──
    location /health {
        proxy_pass http://127.0.0.1:8100;
    }

    # ── Gzip ──
    # NOTE: gzip on TLS + secrets in responses is BREACH-adjacent. JSON API
    # responses here carry no cross-request secrets (tokens are in httpOnly
    # cookies / short-lived access tokens), so this is acceptable.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    listen 80;
}
